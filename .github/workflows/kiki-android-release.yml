name: Kiki Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - store-assets-v1
    paths:
      - "budget_app/**"
      - ".github/workflows/kiki-android-release.yml"

concurrency:
  group: kiki-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: budget_app
    shell: bash

jobs:
  android-release:
    name: Analyze, Test, APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager no existe en: $SDKMANAGER"
            exit 1
          fi

          # sdkmanager puede cerrar la tubería cuando termina de leer
          # las licencias. Ignoramos el SIGPIPE de `yes`, pero validamos
          # el código real de sdkmanager.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "sdkmanager --licenses falló con código $LICENSE_STATUS"
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android SDK 36 instalado correctamente."

      - name: Validate Android configuration
        shell: bash
        run: |
          echo "Revisando configuración Android..."

          echo "Contenido relevante de build.gradle.kts:"
          grep -nE "compileSdk|targetSdk|minSdk" android/app/build.gradle.kts || true

          if grep -qE "compileSdk[[:space:]]*=[[:space:]]*36|compileSdkVersion[[:space:]]+36" android/app/build.gradle.kts; then
            echo "compileSdk 36 declarado directamente."
          elif grep -q "compileSdk = flutter.compileSdkVersion" android/app/build.gradle.kts; then
            echo "compileSdk usa flutter.compileSdkVersion."
          else
            echo "No se pudo identificar una configuración válida de compileSdk."
            exit 1
          fi

          if grep -qE "targetSdk[[:space:]]*=[[:space:]]*36|targetSdkVersion[[:space:]]+36" android/app/build.gradle.kts; then
            echo "targetSdk 36 declarado directamente."
          elif grep -q "targetSdk = flutter.targetSdkVersion" android/app/build.gradle.kts; then
            echo "targetSdk usa flutter.targetSdkVersion."
          else
            echo "No se pudo identificar una configuración válida de targetSdk."
            exit 1
          fi

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Configuración Android validada."

      - name: Restore Android release signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required repository secret: $secret_name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "Decoded keystore was not created or is empty." >&2
            exit 1
          fi

          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties

          test -s android/key.properties
          echo "Release signing files restored from GitHub secrets. Contents are intentionally not printed."

      - name: Flutter pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Verify BillingClient dependency
        shell: bash
        run: |
          set +e

          mkdir -p budget_app/build/reports

          cd budget_app/android

          chmod +x gradlew

          ./gradlew app:dependencyInsight \
          --dependency com.android.billingclient:billing \
          --configuration releaseRuntimeClasspath \
          --no-daemon \
          > ../build/reports/billing.txt 2>&1

          EXIT_CODE=$?

          echo "Gradle terminó con código: $EXIT_CODE"

          cat ../build/reports/billing.txt

          if grep -Eq "com\.android\.billingclient:billing:8\.[0-9.]+" ../build/reports/billing.txt; then
          echo "✅ Billing 8 encontrado."
          exit 0
          fi

          echo "❌ Billing 8 NO encontrado."
          exit 1

      - name: Build APK release
        run: flutter build apk --release

      - name: Verify APK and hash
        run: |
          mkdir -p build/reports
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          sha256sum "$apk" | tee build/reports/apk-sha256.txt
          ls -lh "$apk" | tee build/reports/apk-info.txt

      - name: Build AAB release
        run: |
          mkdir -p build/reports
          set +e
          flutter build appbundle --release 2>&1 | tee build/reports/aab-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            aab="build/app/outputs/bundle/release/app-release.aab"
            if grep -qi 'strip debug symbols' build/reports/aab-build.log && [ -s "$aab" ]; then
              echo "flutter build appbundle failed during strip debug symbols validation, but a non-empty AAB exists. Signature verification will decide whether the workflow can continue." | tee build/reports/aab-build-note.txt
            else
              exit "$status"
            fi
          fi

      - name: Verify AAB exists after build
        run: |
          aab="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -s "$aab" ]; then
            echo "AAB was not generated or is empty." >&2
            exit 1
          fi
          sha256sum "$aab" | tee build/reports/aab-sha256.txt
          ls -lh "$aab" | tee build/reports/aab-info.txt

      - name: Verify AAB signature
        run: |
          aab="build/app/outputs/bundle/release/app-release.aab"
          jarsigner -verify -verbose -certs "$aab" > build/reports/jarsigner-report.txt 2>&1
          if ! grep -q 'jar verified.' build/reports/jarsigner-report.txt; then
            echo "AAB signature verification failed." >&2
            exit 1
          fi
          if [ -f build/reports/aab-build-note.txt ]; then
            echo "AAB was generated and jarsigner verified it after the known strip debug symbols post-build issue." | tee -a build/reports/aab-build-note.txt
          fi

      - name: Write build summary
        if: always()
        run: |
          mkdir -p build/reports
          version_line=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          version_name="${version_line%%+*}"
          version_code="${version_line##*+}"
          billing_version="not verified"
          if [ -f build/reports/billing-version.txt ]; then billing_version=$(cat build/reports/billing-version.txt); fi
          apk_hash="not generated"
          if [ -f build/reports/apk-sha256.txt ]; then apk_hash=$(cat build/reports/apk-sha256.txt); fi
          aab_hash="not generated"
          if [ -f build/reports/aab-sha256.txt ]; then aab_hash=$(cat build/reports/aab-sha256.txt); fi
          {
            echo "# Kiki Android Release"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Flutter | 3.44.8 stable |"
            echo "| Java | 17 Temurin |"
            echo "| versionName | $version_name |"
            echo "| versionCode | $version_code |"
            echo "| compileSdk | 36 |"
            echo "| targetSdk | 36 |"
            echo "| BillingClient | $billing_version |"
            echo "| APK SHA-256 | $apk_hash |"
            echo "| AAB SHA-256 | $aab_hash |"
            echo "| Release artifact | kiki-release-files |"
            echo "| Reports artifact | kiki-build-reports |"
          } | tee build/reports/build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kiki-release-files-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            budget_app/build/app/outputs/flutter-apk/app-release.apk
            budget_app/build/app/outputs/bundle/release/app-release.aab
            budget_app/pubspec.yaml
            budget_app/pubspec.lock

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiki-build-reports-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            budget_app/build/reports/**

      - name: Clean signing files
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties
          test ! -e android/app/upload-keystore.jks
          test ! -e android/key.properties
          echo "Temporary signing files removed."
